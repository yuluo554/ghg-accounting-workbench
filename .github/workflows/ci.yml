name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 新镜像对 py3.8 支持存疑，旧解释器只在 windows 守（见 plan/03 §二）
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout (full history for history-scanning gates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Zero-policy-literal gate
        run: python tools/check_zero_literals.py --selftest

      - name: Run full test suite
        working-directory: code
        run: python -m pytest -q

      - name: CLI smoke (exit codes)
        run: |
          python -c "import sys; sys.path.insert(0, 'code/src'); from ghg.cli import main; sys.exit(main(['selftest']))"
