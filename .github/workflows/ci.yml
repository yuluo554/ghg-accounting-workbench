name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 新镜像对 py3.8 支持存疑，旧解释器只在 windows 守（见 plan/03 §二）
        include:
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout (full history for history-scanning gates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev + gui extras)
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      - name: Zero-policy-literal gate
        run: python tools/check_zero_literals.py --selftest

      - name: Run full test suite
        working-directory: code
        run: python -m pytest -q

      - name: Built-in benchmark (FR-07 三类基准一条命令跑全)
        run: python tools/bench.py

      - name: CLI smoke (exit codes)
        run: |
          python -c "import sys; sys.path.insert(0, 'code/src'); from ghg.cli import main; sys.exit(main(['selftest']))"

      - name: Report export smoke (FR-06 三产物)
        run: |
          python -c "import sys, os; sys.path.insert(0, 'code/src'); from ghg.cli import main; rc = main(['report', '--input', 'data/truth/profiles/steel-2024.json', '--out-dir', os.environ.get('RUNNER_TEMP', '.'), '--format', 'md,xlsx']); sys.exit(rc)"
          python -c "import sys, os; p = os.path.join(os.environ.get('RUNNER_TEMP', '.'), 'report.md'); assert os.path.isfile(p), 'report.md 未生成'; raw = open(p, 'rb').read(); assert b'\r' not in raw, 'report.md 含 CR'"
